# Iron Ring dedicated server (docs/server.md). key=value; '#' starts a comment.
port=7727
name=IRON RING SERVER
motd=
maxPlayers=256
maxRooms=128
roomsPerAddress=3
idleMinutes=30
# Connections sending more messages a second are dropped (a game sends ~130).
maxMessagesPerSecond=400
# Referee every fight with the game's own simulation: needs the game's
# IronRing_Data folder (from the same build) next to the server, or data=.
verify=1
data=IronRing_Data
log=server.log
