name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 1080p headless frame of a CPU-vs-CPU match; uploaded so reviewers can see what changed.
  SMOKE_ARGS: -batchmode -demo -screen-fullscreen 0 -screen-width 1920 -screen-height 1080 -frames 420

jobs:
  art:
    name: Art and audio tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            Tools/Art/requirements.txt
            Tools/Audio/requirements.txt
      - run: pip install -r Tools/Audio/requirements.txt
      # Committed assets match the generator; export -> import is lossless.
      - run: python3 Tools/Art/selftest.py
      # Generated audio is current (effects byte-exact, theme by PCM hash).
      - run: python3 Tools/Audio/generate_audio.py --check

  server-core:
    # The dedicated server needs no SDL: the core preset builds it, the
    # simulation, the tools and the tests alone (what the Dockerfile does).
    name: Server (core build, no SDL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset core -DIR_WARNINGS_AS_ERRORS=ON
      - run: cmake --build --preset core
      - run: ctest --preset core
      - run: Build/core/Server/Debug/IronRingServer --check --verify 0 --port 0

  server-docker:
    # docker-compose.yml and Tools/Server/Dockerfile build, and the image's server starts.
    name: Server (Docker image)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: IRONRING_BUILD_JOBS=4 docker compose build
      - run: docker run --rm ironring-server --check --port 0

  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7

      - name: Install SDL build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev


      - name: Configure
        run: cmake --preset release -DIR_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Smoke run (batch mode)
        run: Build/release/Player/Release/IronRing.x86_64 $SMOKE_ARGS -screenshot smoke-linux-${{ matrix.compiler }}.png

      - name: Smoke run (front end)
        # Title -> Versus CPU -> both picks -> next stage -> fight -> pause, by scripted key taps.
        run: >
          Build/release/Player/Release/IronRing.x86_64 -batchmode -screen-fullscreen 0
          -screen-width 1280 -screen-height 720 -frames 450
          -keys "10:Return,20:Down,30:Return,60:Return,80:Return,160:Right,175:Return,430:Escape"
          -screenshot frontend-linux-${{ matrix.compiler }}.png

      - name: Soak run (arcade ladder)
        # A CHAMPION CPU plays player 1 through the whole ladder; the last frame is the ending.
        run: >
          Build/release/Player/Release/IronRing.x86_64 -batchmode -autoplay -screen-fullscreen 0
          -screen-width 640 -screen-height 360 -frames 20000 -keys "10:Return,30:Return,60:Return"
          -screenshot arcade-linux-${{ matrix.compiler }}.png

      - name: Online soak (server + two headless clients)
        if: matrix.compiler == 'gcc'
        # A real IronRingServer referees match after match between two autoplaying
        # clients over a simulated 40 ms / 10 % loss link; every replay must verify.
        env:
          FRAMES: "9000"
          SOAK_DIR: soak-linux
        run: Tools/Server/soak.sh Build/release

      - uses: actions/upload-artifact@v7
        if: always() && matrix.compiler == 'gcc'
        with:
          name: soak-linux
          path: soak-linux/
          if-no-files-found: ignore

      - name: Server package
        if: matrix.compiler == 'gcc'
        # The dedicated server with the game data it referees with (docs/server.md).
        run: |
          mkdir -p server-linux
          cp Build/release/Server/Release/IronRingServer server-linux/
          cp Source/Server/server.cfg server-linux/server.cfg
          cp -r Build/release/Player/Release/IronRing_Data server-linux/
          server-linux/IronRingServer --check --port 0

      - uses: actions/upload-artifact@v7
        if: matrix.compiler == 'gcc'
        with:
          name: server-linux
          path: server-linux/

      - uses: actions/upload-artifact@v7
        with:
          name: smoke-linux-${{ matrix.compiler }}
          path: |
            smoke-linux-${{ matrix.compiler }}.png
            frontend-linux-${{ matrix.compiler }}.png
            arcade-linux-${{ matrix.compiler }}.png

  packages-linux:
    # The release zips, made by the same scripts a person runs (docs/building.md):
    # build-linux.sh, and build-windows.sh cross-compiling with MinGW-w64.
    name: Release zips (Linux, Windows cross)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build zip g++-mingw-w64-x86-64-posix \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev
      - run: ./build-linux.sh
      - run: ./build-windows.sh
      - name: The zips hold one folder each, with the player in it
        run: |
          unzip -l Dist/IronRing-*-linux-x64.zip | grep -q 'linux-x64/IronRing.x86_64$'
          unzip -l Dist/IronRing-*-windows-x64.zip | grep -q 'windows-x64/IronRing.exe$'
          unzip -l Dist/IronRing-*-windows-x64.zip | grep -q 'windows-x64/IronRing_Data/app.info$'
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-windows
          path: Dist/*.zip

  macos:
    name: macOS (Apple silicon + Intel)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: brew install ninja

      - name: Build, test and pack (build-macos.sh)
        run: ./build-macos.sh --test

      - name: Bundle layout
        run: |
          app=Build/macos/Player/Release/IronRing.app
          ls -R "$app/Contents" | head -40
          test -x "$app/Contents/MacOS/IronRing"
          test -f "$app/Contents/Frameworks/UnityPlayer.dylib"
          test -f "$app/Contents/Resources/Data/app.info"
          test -f "$app/Contents/Resources/IronRing.icns"
          plutil -lint "$app/Contents/Info.plist"
          lipo -archs "$app/Contents/MacOS/IronRing" | grep -q x86_64
          lipo -archs "$app/Contents/Frameworks/UnityPlayer.dylib" | grep -q arm64
          otool -L "$app/Contents/MacOS/IronRing"
          otool -l "$app/Contents/MacOS/IronRing" | grep -A2 LC_RPATH
          otool -L "$app/Contents/Frameworks/UnityPlayer.dylib" | grep -v /System/Library/ | grep -v /usr/lib/

      - name: Smoke run (batch mode)
        run: Build/macos/Player/Release/IronRing.app/Contents/MacOS/IronRing $SMOKE_ARGS -screenshot smoke-macos.png

      - name: Smoke run (the packed app, from the zip)
        run: |
          mkdir unpacked && ditto -x -k Dist/IronRing-*-macos.zip unpacked
          codesign --verify --strict --verbose=2 unpacked/*/IronRing.app
          unpacked/*/IronRing.app/Contents/MacOS/IronRing -batchmode -screen-fullscreen 0 \
            -screen-width 640 -screen-height 360 -frames 120 -logFile unpacked.log
          grep "Data folder" unpacked.log

      - name: Online soak (server + two headless clients)
        env:
          FRAMES: "5400"
          MIN_MATCHES: "1"
          SOAK_DIR: soak-macos
        run: Tools/Server/soak.sh Build/macos

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soak-macos
          path: soak-macos/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            Dist/*.zip
            smoke-macos.png

  windows-script:
    # build-windows.ps1 (what build-windows.bat runs) with the runner's Visual Studio.
    name: Windows (build-windows.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build, test and pack
        shell: pwsh
        run: ./build-windows.ps1 -Test
      - name: Smoke run (the packed folder)
        shell: pwsh
        run: |
          $exe = Get-ChildItem Dist -Recurse -Filter IronRing.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -Wait -PassThru -NoNewWindow `
               -ArgumentList "$env:SMOKE_ARGS -screenshot smoke-windows-script.png".Split(' ')
          if ($p.ExitCode -ne 0) { throw "IronRing.exe exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-msvc
          path: |
            Dist/*.zip
            smoke-windows-script.png

  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    env:
      # The runner image also has MinGW on PATH; make Ninja pick MSVC.
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1


      - name: Configure
        run: cmake --preset release -DIR_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: pwsh
        run: |
          # Compiler diagnostics become annotations, readable without the raw log.
          cmake --build --preset release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': (fatal )?error [A-Z]*\d+' |
              Select-Object -First 20 | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Test
        run: ctest --preset release

      - name: Smoke run (batch mode)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath Build/release/Player/Release/IronRing.exe -Wait -PassThru -NoNewWindow `
               -ArgumentList "$env:SMOKE_ARGS -screenshot smoke-windows-msvc.png".Split(' ')
          if ($p.ExitCode -ne 0) { throw "IronRing.exe exited with $($p.ExitCode)" }

      - name: Server package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force server-windows | Out-Null
          Copy-Item Build/release/Server/Release/IronRingServer.exe server-windows/
          Copy-Item Source/Server/server.cfg server-windows/server.cfg
          Copy-Item -Recurse Build/release/Player/Release/IronRing_Data server-windows/
          & server-windows/IronRingServer.exe --check --port 0
          if ($LASTEXITCODE -ne 0) { throw "IronRingServer --check failed" }

      - uses: actions/upload-artifact@v7
        with:
          name: server-windows
          path: server-windows/

      - uses: actions/upload-artifact@v7
        with:
          name: player-windows-msvc
          path: |
            smoke-windows-msvc.png
            Build/release/Player/Release/

  windows-mingw:
    name: Windows (MinGW UCRT64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git


      - name: Configure and build
        shell: msys2 {0}
        run: |
          cmake --preset release -DIR_WARNINGS_AS_ERRORS=ON
          cmake --build --preset release

      - name: No MinGW runtime DLL imports (ADR-0009)
        shell: msys2 {0}
        run: |
          status=0
          for f in Build/release/Player/Release/IronRing.exe Build/release/Player/Release/UnityPlayer.dll \
                   Build/release/Tests/IronRingTests.exe Build/release/Tools/Release/AssetPacker.exe \
                   Build/release/Server/Release/IronRingServer.exe; do
            imports=$(objdump -p "$f" | grep "DLL Name" | awk '{print $3}' | sort -u | tr '\n' ' ')
            echo "$f: $imports"
            if echo "$imports" | grep -qiE 'libgcc|libstdc\+\+|libwinpthread'; then
              echo "::error file=$f::imports a MinGW runtime DLL"; status=1
            fi
          done
          exit $status

      # The remaining steps run in PowerShell, outside MSYS2, with no MinGW
      # bin folder on PATH: exactly the situation of a CLion run configuration.
      - name: Test (outside MSYS2)
        shell: pwsh
        run: |
          Build/release/Tests/IronRingTests.exe
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: Smoke run (outside MSYS2)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath Build/release/Player/Release/IronRing.exe -Wait -PassThru -NoNewWindow `
               -ArgumentList "$env:SMOKE_ARGS -screenshot smoke-windows-mingw.png".Split(' ')
          if ($p.ExitCode -ne 0) { throw "IronRing.exe exited with $($p.ExitCode)" }

      - uses: actions/upload-artifact@v7
        with:
          name: player-windows-mingw
          path: |
            smoke-windows-mingw.png
            Build/release/Player/Release/

  # Closest public relative of CLion's bundled MinGW (GCC 15.2, msvcrt,
  # posix threads, SEH). Exercises IR_MINGW_RUNTIME=AUTO outside MSYS2.
  windows-mingw-msvcrt:
    name: Windows (MinGW GCC 15.2 msvcrt)
    runs-on: windows-latest
    env:
      MINGW_URL: https://github.com/niXman/mingw-builds-binaries/releases/download/15.2.0-rt_v13-rev1/x86_64-15.2.0-release-posix-seh-msvcrt-rt_v13-rev1.7z
      MINGW_BIN: C:/mingw-msvcrt/mingw64/bin
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest $env:MINGW_URL -OutFile mingw.7z
          7z x mingw.7z -oC:\mingw-msvcrt | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "extract failed" }
          python -m pip install --quiet ninja

      - name: Configure and build
        shell: pwsh
        run: |
          $env:PATH = "$env:MINGW_BIN;$env:PATH"
          cmake --preset release -DIR_WARNINGS_AS_ERRORS=ON `
                -DCMAKE_C_COMPILER="$env:MINGW_BIN/gcc.exe" -DCMAKE_CXX_COMPILER="$env:MINGW_BIN/g++.exe"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build --preset release
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          Get-ChildItem Build/release/Player/Release, Build/release/Tests, Build/release/Tools/Release -Filter lib*.dll |
            ForEach-Object { "copied runtime DLL: $($_.FullName)" }

      # PATH no longer contains the toolchain: binaries must be self-contained.
      - name: Test (toolchain not on PATH)
        shell: pwsh
        run: |
          Build/release/Tests/IronRingTests.exe
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: Smoke run (toolchain not on PATH)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath Build/release/Player/Release/IronRing.exe -Wait -PassThru -NoNewWindow `
               -ArgumentList "$env:SMOKE_ARGS -screenshot smoke-windows-mingw-msvcrt.png".Split(' ')
          if ($p.ExitCode -ne 0) { throw "IronRing.exe exited with $($p.ExitCode)" }
